# MEASURED hardware values. Not tuning — these describe THIS hardware.
# Re-measure when a part is swapped (see README "Calibration").

thruster_driver:
  ros__parameters:
    i2c_bus: 1                 # Pi header I2C (pins 3/5). Pi is the only master (D3)
    i2c_addr: 0x40
    oscillator_hz: 28730000    # PCA9685 board, MEASURED 19 Aug 2026 (D5)
    pwm_freq_hz: 50
    esc_arm_hold_s: 2.0
    cmd_timeout_s: 0.5

    # Channels carried over from v1 wiring — CONFIRM against your harness.
    # Every *_stop_us is a PLACEHOLDER until measured with
    #   scripts/esc_calibrate.py --channel N --stop S --min A --max B

    # Stern T200 + Basic ESC (bidirectional). sign -1 carried over from v1.
    surge_channel: 2
    surge_stop_us: 1500
    surge_span_us: 400
    surge_sign: -1
    surge_bidirectional: true

    # Generic thruster, FORWARD-ONLY ESC. stop = its minimum throttle.
    # sign +1 if its push makes the nose go DOWN, -1 if UP. If you set -1,
    # also set autopilot depth_out_min: -1.0, depth_out_max: 0.0.
    pitch_channel: 1
    pitch_stop_us: 1000
    pitch_span_us: 1000
    pitch_sign: 1
    pitch_bidirectional: false

    # Lateral T200 + Basic ESC (bidirectional).
    # sign +1 if a positive command turns the nose LEFT (CCW seen from above).
    yaw_channel: 0
    yaw_stop_us: 1500
    yaw_span_us: 400
    yaw_sign: 1
    yaw_bidirectional: true

depth_sensor:
  ros__parameters:
    i2c_bus: 1
    fluid_density: 997.0       # fresh water; sea ~1025
    rate_hz: 10.0
    max_failures: 5

gps_node:
  ros__parameters:
    port: /dev/serial0         # Pi GPIO UART (TX pin 8, RX pin 10); USB adapter: /dev/ttyUSB0
    baud: 9600
    frame_id: gps_buoy
    base_accuracy_m: 2.5       # refine from a static scatter test
    status_every: 10
