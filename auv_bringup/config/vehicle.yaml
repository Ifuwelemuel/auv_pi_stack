# TUNING and behaviour. Safe to change between sessions; hardware facts
# live in calibration.yaml.

safety_supervisor:
  ros__parameters:
    watchdog_timeout_s: 0.5
    publish_rate_hz: 20.0

actuator_mixer:
  ros__parameters:
    source_timeout_s: 0.3
    safety_timeout_s: 0.5
    publish_rate_hz: 20.0
    # Normalised limits (1.0 = full calibrated span). Keep low for first
    # water sessions; raise deliberately.
    surge_limit: 0.6
    pitch_limit: 0.6
    yaw_limit: 0.6

teleop_node:
  ros__parameters:
    # Confirm indices with `ros2 topic echo /joy`.
    deadman_button: 4          # LB
    estop_button: 1            # B
    clear_button: 3            # Y
    surge_axis: 5              # right trigger
    yaw_axis: 0                # left stick X  (left = +1 -> nose left)
    pitch_axis: 4              # right stick Y (push = +1 -> nose down)
    surge_scale: 1.0
    yaw_scale: 0.5
    pitch_scale: 0.5
    surge_is_trigger: true

autopilot:
  ros__parameters:
    rate_hz: 10.0
    # mavros IMU topic as seen on the v1 build. CONFIRM: ros2 topic list | grep imu
    imu_topic: /mavros/mavros/data
    imu_timeout_s: 0.5
    depth_timeout_s: 0.7
    setpoint_timeout_s: 1.0
    # Yaw thruster (normalised thrust per rad). Starting guesses — tune in water.
    heading_kp: 0.4
    heading_ki: 0.0
    heading_kd: 0.2
    heading_i_limit: 0.2       # max thrust the I-term may add
    heading_reset_threshold_rad: 0.5
    pivot_error_rad: 0.0       # e.g. 0.8 to turn in place before driving; 0 = off
    # Pitch thruster (normalised thrust per m). Starting guesses — tune in water.
    depth_kp: 0.6
    depth_ki: 0.1              # the I-term learns the buoyancy trim
    depth_kd: 0.4
    depth_i_limit: 0.3         # max thrust the I-term may add; must exceed trim thrust
    depth_reset_threshold_m: 0.2
    depth_out_min: 0.0         # forward-only pitch thruster, nose-down mounting
    depth_out_max: 1.0
    depth_rate_alpha: 0.3
    max_depth_m: 2.0           # pool ceiling; raise deliberately per site

navigator:
  ros__parameters:
    rate_hz: 5.0
    fix_timeout_s: 3.0
    gps_topic: /mavros/global_position/raw/fix
